services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seravita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seravita}
      POSTGRES_DB: ${POSTGRES_DB:-seravita}
    volumes:
      - seravita-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-seravita} -d ${POSTGRES_DB:-seravita}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seravita}:${POSTGRES_PASSWORD:-seravita}@db:5432/${POSTGRES_DB:-seravita}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  seravita-db:
